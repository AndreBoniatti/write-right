<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WriteRight</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WriteRight.Client.styles.css" rel="stylesheet" />

    <!-- Tema claro/escuro: aplica o atributo ANTES do body pintar (sem flash).
         Preferência salva > preferência do sistema. Exposto pro ThemeToggle. -->
    <script>
        window.writerightTheme = {
            get: function () {
                return document.documentElement.getAttribute('data-theme') || 'light';
            },
            set: function (t) {
                try { localStorage.setItem('wr-theme', t); } catch (e) { }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            }
        };
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('wr-theme'); } catch (e) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            window.writerightTheme.set(saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <!-- Modo "tentar antes de ver" da revisão: preferência persistida. Só isso —
         nada é aplicado no <html>, então não precisa rodar antes do body pintar. -->
    <script>
        window.writerightDrill = {
            get: function () {
                try { return localStorage.getItem('wr-drill') === '1'; } catch (e) { return false; }
            },
            set: function (on) {
                try { localStorage.setItem('wr-drill', on ? '1' : '0'); } catch (e) { }
            }
        };
    </script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-brand">
                <span class="app-loading-mark">W</span>
                <span class="app-loading-word">WriteRight</span>
            </div>
            <div class="app-loading-bar"><span></span></div>
            <div class="app-loading-text">Carregando…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
