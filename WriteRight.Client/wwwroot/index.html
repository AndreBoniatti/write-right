<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WriteRight</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WriteRight.Client.styles.css" rel="stylesheet" />

    <!-- Tema claro/escuro: aplica o atributo ANTES do body pintar (sem flash).
         Preferência salva > preferência do sistema. Exposto pro ThemeToggle. -->
    <script>
        window.writerightTheme = {
            get: function () {
                return document.documentElement.getAttribute('data-theme') || 'light';
            },
            set: function (t) {
                try { localStorage.setItem('wr-theme', t); } catch (e) { }
                document.documentElement.setAttribute('data-theme', t);
                document.documentElement.setAttribute('data-bs-theme', t);
            }
        };
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('wr-theme'); } catch (e) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            window.writerightTheme.set(saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <!-- Balão das correções (Practice.razor): sob a última linha do trecho marcado,
         sem passar da largura do texto. O balão nasce invisível; aparece já no lugar.
         Fixado (clique ou setas), o foco vai pro trecho e a tela rola até ele.
         O balão nunca sai da tela: passando do fim da página, ele a esticava, e a
         rolagem caía numa faixa vazia sem a sidebar. Não cabendo embaixo, abre em
         cima; não cabendo em nenhum dos dois, fica no lado maior e rola por dentro. -->
    <script>
        window.writerightMarks = {
            place: function (markId, popId, focusMark) {
                var mark = document.getElementById(markId);
                var pop = document.getElementById(popId);
                if (!mark || !pop || !pop.offsetParent) return;
                // O trecho entra na tela antes de medir: o espaço livre conta a partir dele.
                if (focusMark) {
                    mark.focus({ preventScroll: true });
                    mark.scrollIntoView({ block: 'nearest' });
                }
                var gap = 6, edge = 8;
                var box = pop.offsetParent.getBoundingClientRect();
                var lines = mark.getClientRects();
                var first = lines[0], last = lines[lines.length - 1];
                // A barra do topo é sticky e fica por cima do balão.
                var bar = document.querySelector('.top-row');
                var ceiling = Math.max(0, bar ? bar.getBoundingClientRect().bottom : 0);
                var below = window.innerHeight - last.bottom - gap - edge;
                var above = first.top - ceiling - gap - edge;
                pop.style.maxHeight = 'none';
                var up = pop.offsetHeight > below && above > below;
                var line = up ? first : last;
                pop.style.maxHeight = Math.max(120, up ? above : below) + 'px';
                pop.style.left = Math.max(0, Math.min(line.left - box.left, box.width - pop.offsetWidth)) + 'px';
                // Em cima, preso pela base: se o balão crescer, cresce pra longe do trecho.
                pop.style.top = up ? 'auto' : (last.bottom - box.top + gap) + 'px';
                pop.style.bottom = up ? (box.bottom - first.top + gap) + 'px' : 'auto';
                pop.style.visibility = 'visible';
            },

            // Esc, ← → e clique fora valem na página toda, não só com o foco no card.
            // Só incomoda o .NET com o balão aberto.
            watch: function (dotnet, popId) {
                window.writerightMarks.unwatch();
                var isOpen = function () { return !!document.getElementById(popId); };
                var onKey = function (e) {
                    if (!isOpen()) return;
                    if (e.key !== 'Escape' && e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
                    e.preventDefault();
                    dotnet.invokeMethodAsync('OnPopoverKey', e.key);
                };
                var onDown = function (e) {
                    if (!isOpen() || e.target.closest('#' + popId + ', .wr-mark')) return;
                    dotnet.invokeMethodAsync('ClosePopover');
                };
                document.addEventListener('keydown', onKey);
                document.addEventListener('pointerdown', onDown);
                window.writerightMarks.off = function () {
                    document.removeEventListener('keydown', onKey);
                    document.removeEventListener('pointerdown', onDown);
                };
            },

            unwatch: function () {
                if (window.writerightMarks.off) window.writerightMarks.off();
                window.writerightMarks.off = null;
            }
        };
    </script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-brand">
                <span class="app-loading-mark">W</span>
                <span class="app-loading-word">WriteRight</span>
            </div>
            <div class="app-loading-bar"><span></span></div>
            <div class="app-loading-text">Carregando…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo deu errado na página.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
